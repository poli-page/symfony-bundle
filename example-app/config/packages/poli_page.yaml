poli_page:
    api_key: '%env(POLI_PAGE_API_KEY)%'
    # Injected by the review harness (api-develop). A plain env placeholder lets
    # Symfony defer validation to runtime, where the value is set — restores the
    # wiring dropped in b4f12b2 without hardcoding a URL. (A `default:` processor
    # here materialises "" at compile time and trips the bundle's scheme check.)
    base_url: '%env(POLI_PAGE_BASE_URL)%'
    exception_listener:
        enabled: true  # map PoliPageException -> {code,message,status,requestId} JSON
